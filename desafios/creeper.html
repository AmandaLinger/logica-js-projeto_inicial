<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creeper</title>
</head>
<body>
    <canvas width="700" height="700"></canvas>

    <script>
        let tela = document.querySelector('canvas')
        pincel = tela.getContext('2d')

        pincel.fillStyle = 'lightgrey'
        pincel.fillRect(0,0,700,700);

        pincel.fillStyle = 'green'
        pincel.fillRect(100, 100, 500,500)

        pincel.fillStyle = 'black'
        pincel.fillRect(200, 200, 100 , 100)
        pincel.fillRect(400, 200, 100 , 100)
        pincel.fillRect(300, 300, 100 , 100)

        pincel.fillRect(250,350, 200,100)

        pincel.fillRect(250,400, 60,100)
        pincel.fillRect(390,400, 60,100)
    </script>
</body>
</html>
