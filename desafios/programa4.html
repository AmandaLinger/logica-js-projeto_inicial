<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa 4</title>
</head>
<body>
    <canvas width="600" height="400"></canvas>

    <script>
        let tela = document.querySelector('canvas')
        let pincel = tela.getContext('2d')

        pincel.fillStyle = 'lightgrey'
        pincel.fillRect(0,0,600,400)

        function desenhaCirculo(x,y,raio){
            pincel.fillStyle = 'blue'
            pincel.beginPath()
            pincel.arc(x,y,raio, 0, 2*Math.PI)
            pincel.fill()
        }

        function limpaTela(){
            pincel.clearRect(0,0,600,400) //limpa 
        }

        var x = 20
        function atualizaTela(){
            limpaTela()
            desenhaCirculo(x,20,10)
            x++ //aqui o x incrementa +1 toda vez q essa função roda(modificando a posição do circulo)
        }

        setInterval(atualizaTela, 20) //o método setInterval executa uma função após um tempo(em milisegundos)
    </script>
</body>
</html>
