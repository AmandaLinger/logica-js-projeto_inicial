<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click no shift</title>
</head>
<body>
    <canvas width="600" height="400"></canvas>

<script>
    var tela = document.querySelector('canvas');
    var pincel = tela.getContext('2d');

    pincel.fillStyle = 'grey';
    pincel.fillRect(0, 0, 600, 400);
    let raio = 10

    function desenhaCirculo(evento) {
        let x = evento.pageX - tela.offsetLeft;
        let y = evento.pageY - tela.offsetTop;
        console.log(x + ',' + y);

        if(evento.shiftKey && raio<40){ // os operadores fazem a condição ter o click no shift e raio menor que 40
            raio = raio + 10 //adiona 10 de raio para cada click feito apertando o shift

        } else if(evento.altKey && raio>10){
            raio = raio -5
        }
        pincel.fillStyle = 'blue';
        pincel.beginPath();
        pincel.arc(x, y, raio, 0, 2*3.14)
        pincel.fill();

    }
    tela.onclick = desenhaCirculo;

</script>
</body>
</html>
