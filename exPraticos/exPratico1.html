<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desenhando</title>
</head>
<body>
    <canvas width="600" height="400"></canvas>

    <script>
        let tela = document.querySelector('canvas');
        let pincel = tela.getContext('2d');

        pincel.fillStyle = 'grey';
        pincel.fillRect(0, 0, 600, 400);

        let desenha = false;

        function desenhaCirculo(evento) {
            if(desenha){
                let x = evento.pageX - tela.offsetLeft;
                let y = evento.pageY - tela.offsetTop;

                pincel.fillStyle = 'blue'
                pincel.beginPath()
                pincel.arc(x,y,10,0,2*3.14)
                pincel.fill()
            }
            console.log(x + ',' + y)
        }

        tela.onmousemove = desenhaCirculo;

        function habilitaDesenho(){
            desenha = true
        }
        function desabilitaDesenho(){
            desenha = false
        }

        tela.onmousedown = habilitaDesenho //onmousedown = disparado toda vez que o botão esquerdo do mouse é pressionado

        tela.onmouseup = desabilitaDesenho //onmouseup = quando ele é solto

    </script>
</body>
</html>
